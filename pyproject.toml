[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "behave-retry"
version = "1.6.0"
description = "Automatic retry for failed Behave scenarios — tag overrides, exception filtering, flakiness stats"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Mathias Paulenko" },
]
keywords = ["behave", "bdd", "cucumber", "gherkin", "retry", "flaky", "testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "behave>=1.2.6",
]

[project.urls]
Homepage = "https://github.com/MathiasPaulenko/behave-retry"
Repository = "https://github.com/MathiasPaulenko/behave-retry"
Issues = "https://github.com/MathiasPaulenko/behave-retry/issues"
Changelog = "https://github.com/MathiasPaulenko/behave-retry/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["behave_retry"]

[tool.hatch.build.targets.wheel.force-include]
"behave_retry/py.typed" = "behave_retry/py.typed"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/integration/features/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["behave_retry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["tests", "."]

[tool.coverage.run]
source = ["behave_retry"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
